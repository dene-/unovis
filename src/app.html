<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta
			name="description"
			content="Constructivist print generator after Lissitzky, Rodchenko, Malevich, Popova, Klutsis, Stepanova and the Stenberg brothers."
		/>
		<meta name="theme-color" content="#e1e2c7" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#1a191d" media="(prefers-color-scheme: dark)" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Unovis" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/icons/favicon-32.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
