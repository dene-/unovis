name: Probe
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bash .github/probe/run.sh
      - if: always()
        run: python3 .github/probe/emit.py install.txt check.txt eslint.txt prettier.txt
      - if: always()
        run: python3 .github/probe/emit.py test.txt build.txt
      - if: always()
        run: cat out/part0.txt 2>/dev/null || true
      - if: always()
        run: cat out/part1.txt 2>/dev/null || true
      - if: always()
        run: cat out/part2.txt 2>/dev/null || true
      - if: always()
        run: cat out/part3.txt 2>/dev/null || true
      - if: always()
        run: cat out/part4.txt 2>/dev/null || true
      - if: always()
        run: cat out/part5.txt 2>/dev/null || true
      - if: always()
        run: cat out/part6.txt 2>/dev/null || true
      - if: always()
        run: cat out/part7.txt 2>/dev/null || true
      - if: always()
        run: cat out/part8.txt 2>/dev/null || true
      - if: always()
        run: cat out/part9.txt 2>/dev/null || true
      - if: always()
        run: cat out/part10.txt 2>/dev/null || true
      - if: always()
        run: cat out/part11.txt 2>/dev/null || true
