name: Probe
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bash .github/probe/run.sh
      - if: always()
        run: python3 .github/probe/emit.py install.txt prettier.txt check.txt eslint.txt prettiercheck.txt
      - if: always()
        run: python3 .github/probe/emit.py test.txt build.txt
      - if: always()
        run: python3 .github/probe/emit.py formatted.tgz
      - if: always()
        run: python3 .github/probe/emit.py package-lock.json
