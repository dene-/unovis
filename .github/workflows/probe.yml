name: Probe
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: bash .github/probe/run.sh
      - run: python3 .github/probe/emit.py install.txt sync.txt prettier.txt check.txt
      - run: python3 .github/probe/emit.py eslint.txt test.txt build.txt buildls.txt
      - run: python3 .github/probe/emit.py format.diff
      - run: python3 .github/probe/emit.py package-lock.json
