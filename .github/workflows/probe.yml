name: Probe
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: bash .github/probe/run.sh
      - if: always()
        run: python3 .github/probe/emit.py install.txt npmlog.txt
      - if: always()
        run: python3 .github/probe/emit.py eslint.txt test.txt build.txt buildls.txt
      - if: always()
        run: python3 .github/probe/emit.py format.diff
      - if: always()
        run: python3 .github/probe/emit.py package-lock.json
